appId: com.davidtriminio.localdrivesync
productName: Local Drive Sync
copyright: Copyright © 2026 David Triminio

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Módulo nativo: se incluye descomprimido para que cargue correctamente.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Plantillas PSD/AI y catálogo de plataformas del creador de proyectos.
# Se copian a <resources>/creator (process.resourcesPath) fuera del asar.
extraResources:
  - from: resources/creator
    to: creator

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
