appId: com.davidtriminio.localdrivesync
productName: Local Drive Sync
copyright: Copyright © 2026 David Triminio

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Módulo nativo: se incluye descomprimido para que cargue correctamente.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
